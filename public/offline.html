<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141414">
<title>LearnHarness — offline</title>
<style>
	:root { color-scheme: dark; }
	html, body { height: 100%; margin: 0; }
	body {
		background: #141414; color: #e6e6e6;
		font: 15px/1.5 ui-monospace, "JetBrains Mono", SFMono-Regular, Menlo, monospace;
		display: grid; place-items: center;
		padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
		box-sizing: border-box;
	}
	main { max-width: 22rem; text-align: center; }
	img { width: 72px; height: 72px; border-radius: 16px; }
	h1 { font-size: 17px; font-weight: 600; margin: 20px 0 8px; }
	p { color: #9a9a9a; margin: 0 0 24px; }
	button {
		font: inherit; color: #e6e6e6; background: #1c1c1c;
		border: 1px solid #434343; border-radius: 8px;
		min-height: 44px; padding: 0 20px; cursor: pointer;
	}
</style>
</head>
<body>
<main>
	<img src="/pwa/icon-192.png" alt="">
	<h1>Can't reach LearnHarness</h1>
	<p>The server isn't answering. Check that Tailscale is connected on this device, then try again.</p>
	<button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
